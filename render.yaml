services:
  # AI Dynamic Underwriting Engine (Full-Stack Unified Service)
  - type: web
    name: dynamic-underwriting-engine
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .. && python backend/seed.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
